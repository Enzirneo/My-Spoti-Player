<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' https://*.scdn.co data:; style-src 'self'; script-src 'self'"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Spoti Player</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <!-- Ícones: um sprite só, reutilizado com <use>. Usam currentColor (cor vem do CSS). -->
    <svg class="sprite" aria-hidden="true">
      <symbol id="icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></symbol>
      <symbol id="icon-pause" viewBox="0 0 24 24">
        <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
      </symbol>
      <symbol id="icon-next" viewBox="0 0 24 24">
        <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
      </symbol>
      <symbol id="icon-previous" viewBox="0 0 24 24">
        <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
      </symbol>
      <symbol id="icon-shuffle" viewBox="0 0 24 24">
        <path
          d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.46 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z"
        />
      </symbol>
      <symbol id="icon-repeat" viewBox="0 0 24 24">
        <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z" />
      </symbol>
      <symbol id="icon-heart" viewBox="0 0 24 24">
        <path
          d="M16.5 3c-1.74 0-3.41.81-4.5 2.09C10.91 3.81 9.24 3 7.5 3 4.42 3 2 5.42 2 8.5c0 3.78 3.4 6.86 8.55 11.54L12 21.35l1.45-1.32C18.6 15.36 22 12.28 22 8.5 22 5.42 19.58 3 16.5 3zm-4.4 15.55l-.1.1-.1-.1C7.14 14.24 4 11.39 4 8.5 4 6.5 5.5 5 7.5 5c1.54 0 3.04.99 3.57 2.36h1.87C13.46 5.99 14.96 5 16.5 5c2 0 3.5 1.5 3.5 3.5 0 2.89-3.14 5.74-7.9 10.05z"
        />
      </symbol>
      <symbol id="icon-heart-filled" viewBox="0 0 24 24">
        <path
          d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"
        />
      </symbol>
      <symbol id="icon-link" viewBox="0 0 24 24">
        <path
          d="M3.9 12c0-1.71 1.39-3.1 3.1-3.1h4V7H7c-2.76 0-5 2.24-5 5s2.24 5 5 5h4v-1.9H7c-1.71 0-3.1-1.39-3.1-3.1zM8 13h8v-2H8v2zm9-6h-4v1.9h4c1.71 0 3.1 1.39 3.1 3.1s-1.39 3.1-3.1 3.1h-4V17h4c2.76 0 5-2.24 5-5s-2.24-5-5-5z"
        />
      </symbol>
      <symbol id="icon-tag" viewBox="0 0 24 24">
        <path
          d="M19 11h-8v6h8v-6zm4 8V4.98C23 3.88 22.1 3 21 3H3c-1.1 0-2 .88-2 1.98V19c0 1.1.9 2 2 2h18c1.1 0 2-.9 2-2zm-2 .02H3V4.97h18v14.05z"
        />
      </symbol>
      <symbol id="icon-arrow-down" viewBox="0 0 24 24">
        <path d="M20 12l-1.41-1.41L13 16.17V4h-2v12.17l-5.58-5.59L4 12l8 8 8-8z" />
      </symbol>
      <symbol id="icon-close" viewBox="0 0 24 24">
        <path
          d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"
        />
      </symbol>
      <symbol id="icon-volume" viewBox="0 0 24 24">
        <path
          d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"
        />
      </symbol>
    </svg>

    <!-- data-mode: "normal" (janelinha com cartão da capa) ou "tag" (pílula mini). -->
    <main class="player" id="player" data-mode="normal">
      <!-- ===== Modo tag: pílula com capa redonda, título, controles e onda ===== -->
      <section class="tag" id="tag">
        <img class="tag__cover" id="tag-cover" alt="" />
        <div class="tag__main">
          <p class="tag__line">
            <span class="tag__text">
              <span class="tag__title" id="tag-title"></span>
              <span class="tag__artist" id="tag-artist"></span>
            </span>
          </p>
          <div class="tag__controls">
            <button
              class="tag__btn"
              id="tag-previous-btn"
              title="Anterior"
              aria-label="Anterior"
            >
              <svg class="icon"><use href="#icon-previous" /></svg>
            </button>
            <button
              class="play-btn play-btn--tag"
              id="tag-play-btn"
              title="Play/pause"
              aria-label="Play/pause"
            >
              <svg class="icon play-btn__icon play-btn__icon--play">
                <use href="#icon-play" />
              </svg>
              <svg class="icon play-btn__icon play-btn__icon--pause">
                <use href="#icon-pause" />
              </svg>
            </button>
            <button
              class="tag__btn"
              id="tag-next-btn"
              title="Próxima"
              aria-label="Próxima"
            >
              <svg class="icon"><use href="#icon-next" /></svg>
            </button>
          </div>
        </div>
        <!-- Onda decorativa na borda de baixo: concentrada no meio, some nas pontas. -->
        <div class="tag__wave" aria-hidden="true">
          <i class="wave__layer"></i><i class="wave__layer"></i
          ><i class="wave__layer"></i>
        </div>
      </section>

      <!-- ===== Modo normal ===== -->
      <div class="full">
        <!-- Cartão grande com a capa; o texto fica por cima, embaixo à esquerda. -->
        <section class="cover">
          <div class="cover__images" aria-hidden="true">
            <img class="cover__img" id="cover-a" alt="" />
            <img class="cover__img" id="cover-b" alt="" />
          </div>
          <div class="cover__shade" aria-hidden="true"></div>

          <!-- Os botões do topo só aparecem com o mouse sobre a janela. -->
          <header class="topbar">
            <button
              class="chip-btn"
              id="tag-mode-btn"
              title="Modo mini (tag)"
              aria-label="Modo mini"
            >
              <svg class="icon"><use href="#icon-tag" /></svg>
            </button>
            <button
              class="chip-btn"
              id="hide-btn"
              title="Ocultar na bandeja"
              aria-label="Ocultar"
            >
              <svg class="icon"><use href="#icon-arrow-down" /></svg>
            </button>
            <div class="volume">
              <svg class="icon icon--sm volume__icon"><use href="#icon-volume" /></svg>
              <input
                class="volume__slider"
                id="volume"
                type="range"
                min="0"
                max="100"
                aria-label="Volume"
              />
            </div>
            <button
              class="chip-btn"
              id="copy-btn"
              title="Copiar link"
              aria-label="Copiar link"
            >
              <svg class="icon"><use href="#icon-link" /></svg>
            </button>
            <button class="chip-btn" id="close-btn" title="Fechar" aria-label="Fechar">
              <svg class="icon"><use href="#icon-close" /></svg>
            </button>
          </header>

          <div class="cover__bottom">
            <div class="info" id="info">
              <h1 class="info__title" id="title"></h1>
              <p class="info__sub">
                <span class="info__artist" id="artist"></span>
                <span class="info__album" id="album"></span>
              </p>
            </div>
            <button
              class="chip-btn like-btn"
              id="like-btn"
              title="Curtir"
              aria-label="Curtir"
            >
              <svg class="icon like-btn__icon like-btn__icon--off">
                <use href="#icon-heart" />
              </svg>
              <svg class="icon like-btn__icon like-btn__icon--on">
                <use href="#icon-heart-filled" />
              </svg>
            </button>
          </div>
        </section>

        <!-- Progresso: a parte tocada vira uma onda; a bolinha arrasta/clica para pular. -->
        <div class="progress">
          <div class="progress__bar" id="progress-bar">
            <div class="wave__line"></div>
            <div class="wave__played">
              <i class="wave__layer"></i><i class="wave__layer"></i
              ><i class="wave__layer"></i>
            </div>
            <div class="wave__thumb"></div>
          </div>
          <div class="progress__times">
            <span id="time-current">0:00</span>
            <span id="time-total">0:00</span>
          </div>
        </div>

        <div class="controls" id="controls">
          <button
            class="controls__plain"
            id="shuffle-btn"
            title="Aleatório"
            aria-label="Aleatório"
          >
            <svg class="icon icon--lg"><use href="#icon-shuffle" /></svg>
          </button>
          <button
            class="controls__round"
            id="previous-btn"
            title="Anterior"
            aria-label="Anterior"
          >
            <svg class="icon icon--lg"><use href="#icon-previous" /></svg>
          </button>
          <button
            class="controls__round play-btn"
            id="play-btn"
            title="Play/pause"
            aria-label="Play/pause"
          >
            <svg class="icon icon--xl play-btn__icon play-btn__icon--play">
              <use href="#icon-play" />
            </svg>
            <svg class="icon icon--xl play-btn__icon play-btn__icon--pause">
              <use href="#icon-pause" />
            </svg>
          </button>
          <button
            class="controls__round"
            id="next-btn"
            title="Próxima"
            aria-label="Próxima"
          >
            <svg class="icon icon--lg"><use href="#icon-next" /></svg>
          </button>
          <button
            class="controls__plain"
            id="repeat-btn"
            title="Repetir"
            aria-label="Repetir"
          >
            <svg class="icon icon--lg"><use href="#icon-repeat" /></svg>
          </button>
        </div>
      </div>

      <!-- Cobre o player quando não há o que mostrar (login, nada tocando...). -->
      <div class="status" id="status" hidden>
        <p class="status__text" id="status-text"></p>
        <button class="status__action" id="status-action" hidden></button>
      </div>

      <p class="banner" id="banner" hidden></p>
      <p class="toast" id="toast"></p>
    </main>

    <script type="module" src="renderer.js"></script>
  </body>
</html>
